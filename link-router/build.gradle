plugins { id 'com.android.application' version '8.13.0' }

android {
    namespace 'com.rohan.linkrouter'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rohan.linkrouter'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Custom Tabs: ephemeral (incognito) tabs in Chromium browsers
    implementation 'androidx.browser:browser:1.9.0'
    // Material Design 3 components + Material You dynamic colour
    implementation 'com.google.android.material:material:1.12.0'
    // align kotlin-stdlib-jdk7/8 with kotlin-stdlib to avoid duplicate classes
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
