plugins { id 'com.android.application' version '8.13.0' }

android {
    namespace 'com.rohan.weatherwidget'
    compileSdk 36
    defaultConfig {
        applicationId 'com.rohan.weatherwidget'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // the IKEA hub's API changes devices with PATCH, which HttpURLConnection can't send
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
